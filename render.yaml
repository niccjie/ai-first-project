services:
  - type: web
    name: ai-creator-studio-niccjie
    runtime: node
    rootDir: ai-story-studio/server
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: ALLOWED_ORIGIN
        value: https://niccjie.github.io
